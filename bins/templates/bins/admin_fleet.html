<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin — Fleet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root{--bg:#fef7ef;--card:#fff;--text:#2a3042;--muted:#6d7386;--accent:#de7c4e;--border:#e8dccb}
      body{font-family:"Work Sans",Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:var(--text);padding:20px}
      .container{max-width:1100px;margin:18px auto;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
      h1{font-family:"DM Serif Display",Georgia,serif;margin:0 0 10px}
      table{width:100%;border-collapse:collapse;margin-top:12px}
      th,td{padding:12px;border-bottom:1px solid #f1e7de;text-align:left}
      th{color:var(--muted);font-size:0.85rem;text-transform:uppercase}
      .back{display:inline-block;margin-left:12px;padding:8px 12px;border-radius:8px;background:#fff;border:1px solid var(--border);text-decoration:none;color:var(--text)}
      .nav{display:flex;gap:8px;margin-bottom:24px}
      .nav a{padding:8px 12px;border-radius:999px;background:#fff;border:1px solid var(--border);text-decoration:none;color:var(--text);font-weight:600}
      .title{display:flex;align-items:center;justify-content:space-between}
    </style>
  </head>
  <body>
    <div class="container">
      <div class="title">
        <h1>Fleet</h1>
        <div>
          <a class="back" href="{% url 'role-dashboard' role_slug=role_slug %}">Back to dashboard</a>
        </div>
      </div>

      <div class="nav">
        <a href="{% url 'admin-routes' %}">Routes</a>
        <a href="{% url 'admin-reports' %}">Reports</a>
        <a href="{% url 'admin-fleet' %}">Fleet</a>
        <a href="{% url 'admin-zones' %}">Zones</a>
        <a href="{% url 'crew-route' %}">Crew route</a>
      </div>

      <table>
        <thead>
          <tr>
            <th>Vehicle</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          {% for vehicle in fleet %}
          <tr>
            <td>{{ vehicle.license_plate }}</td>
            <td>{{ vehicle.status }}</td>
          </tr>
          {% empty %}
          <tr><td colspan="2">No vehicles available.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </body>
</html>
